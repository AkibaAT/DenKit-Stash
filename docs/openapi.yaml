components:
  schemas:
    BuildFileUploadResponse:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
        uploadHeaders:
          additionalProperties:
            type: string
          type: object
        uploadParams:
          additionalProperties:
            type: string
          type: object
        uploadUrl:
          format: uri
          type: string
      required:
        - id
        - uploadUrl
        - uploadParams
        - uploadHeaders
      type: object
    CoreBuildResponse:
      additionalProperties: false
      properties:
        created_at:
          type: string
        id:
          format: int64
          type: integer
        parent_build_id:
          format: int64
          type: integer
        state:
          type: string
        upload_id:
          format: int64
          type: integer
        user_version:
          type: string
      required:
        - id
        - user_version
        - state
        - created_at
      type: object
    CoreUploadResponse:
      additionalProperties: false
      properties:
        display_name:
          type: string
        filename:
          type: string
        id:
          format: int64
          type: integer
        platforms:
          description: JSON array encoded as a string.
          type: string
        size:
          format: int64
          type: integer
        storage:
          type: string
        type:
          type: string
      required:
        - id
        - filename
        - display_name
        - size
        - storage
        - type
        - platforms
      type: object
    FinalizedBuildFileResponse:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
        size:
          format: int64
          type: integer
        state:
          type: string
      required:
        - id
        - size
        - state
      type: object
    GameResponse:
      additionalProperties: false
      properties:
        classification:
          type: string
        id:
          format: int64
          type: integer
        short_text:
          type: string
        title:
          type: string
        type:
          type: string
        url:
          type: string
        user:
          $ref: "#/components/schemas/PublicUserResponse"
      required:
        - id
        - title
        - short_text
        - type
        - classification
        - url
        - user
      type: object
    PublicUserResponse:
      additionalProperties: false
      properties:
        display_name:
          type: string
        id:
          format: int64
          type: integer
        username:
          type: string
      required:
        - id
        - username
        - display_name
      type: object
    UpgradePathResponseUpgradePathStruct:
      additionalProperties: false
      properties:
        builds:
          items:
            $ref: "#/components/schemas/WharfBuildResponse"
          type:
            - array
            - "null"
      required:
        - builds
      type: object
    WharfBuildFileResponse:
      additionalProperties: false
      properties:
        createdAt:
          type: string
        id:
          format: int64
          type: integer
        size:
          format: int64
          type: integer
        state:
          enum:
            - uploading
            - uploaded
            - failed
            - evicted
            - rebuilding
          type: string
        subType:
          examples:
            - default
          type: string
        type:
          enum:
            - archive
            - patch
            - signature
          type: string
        updatedAt:
          type: string
      required:
        - id
        - size
        - state
        - type
        - subType
        - createdAt
        - updatedAt
      type: object
    WharfBuildResponse:
      additionalProperties: false
      properties:
        createdAt:
          type: string
        files:
          items:
            $ref: "#/components/schemas/WharfBuildFileResponse"
          type:
            - array
            - "null"
        id:
          format: int64
          type: integer
        parentBuildId:
          format: int64
          type: integer
        state:
          enum:
            - started
            - processing
            - completed
            - failed
          type: string
        updatedAt:
          type: string
        uploadId:
          format: int64
          type: integer
        userVersion:
          type: string
        version:
          format: int64
          type: integer
      required:
        - id
        - uploadId
        - parentBuildId
        - version
        - state
        - userVersion
        - files
        - createdAt
        - updatedAt
      type: object
    WharfChannelResponse:
      additionalProperties: false
      properties:
        head:
          $ref: "#/components/schemas/WharfBuildResponse"
        name:
          type: string
        upload:
          $ref: "#/components/schemas/WharfUploadRefResponse"
      required:
        - name
        - upload
      type: object
    WharfUploadRefResponse:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
      required:
        - id
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: Raw API key, Bearer token, or access_token token.
      in: header
      name: Authorization
      type: apiKey
info:
  title: DenKit Stash API
  version: 1.0.0
openapi: 3.1.0
paths:
  /:
    get:
      operationId: get-status
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  message:
                    examples:
                      - DenKit Stash
                    type: string
                  version:
                    examples:
                      - 1.0.0
                    type: string
                required:
                  - message
                  - version
                type: object
          description: OK
      summary: Get service status
      tags:
        - Status
  /builds/{buildId}/download/{type}/{subType}:
    get:
      operationId: download-build-artifact
      parameters:
        - in: path
          name: buildId
          required: true
          schema:
            format: int64
            type: integer
        - in: path
          name: type
          required: true
          schema:
            type: string
        - in: path
          name: subType
          required: true
          schema:
            type: string
      responses:
        "307":
          description: Temporary Redirect
          headers:
            Location:
              schema:
                format: uri
                type: string
        "400":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      type: string
                    type:
                      - array
                      - "null"
                required:
                  - errors
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      type: string
                    type:
                      - array
                      - "null"
                required:
                  - errors
                type: object
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      type: string
                    type:
                      - array
                      - "null"
                required:
                  - errors
                type: object
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      type: string
                    type:
                      - array
                      - "null"
                required:
                  - errors
                type: object
          description: Not Found
      security:
        - ApiKeyAuth: []
      summary: Redirect to a build artifact by type and subtype
      tags:
        - Downloads
    head:
      operationId: head-build-artifact
      parameters:
        - in: path
          name: buildId
          required: true
          schema:
            format: int64
            type: integer
        - in: path
          name: type
          required: true
          schema:
            type: string
        - in: path
          name: subType
          required: true
          schema:
            type: string
      responses:
        "307":
          description: Temporary Redirect
          headers:
            Location:
              schema:
                format: uri
                type: string
        "401":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      type: string
                    type:
                      - array
                      - "null"
                required:
                  - errors
                type: object
          description: Unauthorized
      security:
        - ApiKeyAuth: []
      summary: Redirect to a build artifact by type and subtype
      tags:
        - Downloads
