services:
  denkit-stash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: denkit-stash
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_USE_SSL=${S3_USE_SSL}
      - S3_REGION=${S3_REGION:-us-east-1}
      - PORT=${PORT}
      - ENABLE_DEV_ENDPOINTS=false
      - DENKIT_API_KEY_HASH_SECRET=${DENKIT_API_KEY_HASH_SECRET}
      - DENKIT_HTTP_READ_HEADER_TIMEOUT=${DENKIT_HTTP_READ_HEADER_TIMEOUT:-5s}
      - DENKIT_HTTP_READ_TIMEOUT=${DENKIT_HTTP_READ_TIMEOUT:-30m}
      - DENKIT_HTTP_WRITE_TIMEOUT=${DENKIT_HTTP_WRITE_TIMEOUT:-30m}
      - DENKIT_HTTP_IDLE_TIMEOUT=${DENKIT_HTTP_IDLE_TIMEOUT:-2m}
      - DENKIT_MAX_REQUEST_BODY_BYTES=${DENKIT_MAX_REQUEST_BODY_BYTES:-1048576}
      - DENKIT_MAX_UPLOAD_SESSION_BYTES=${DENKIT_MAX_UPLOAD_SESSION_BYTES:-53687091200}
      # Archive cache eviction (opt-in; see .env.example). TMPDIR points at
      # the disk-backed scratch volume so multi-GB rebuilds stay off tmpfs.
      - TMPDIR=/scratch
      - DENKIT_ARCHIVE_GC_ENABLED=${DENKIT_ARCHIVE_GC_ENABLED:-false}
      - DENKIT_ARCHIVE_TTL=${DENKIT_ARCHIVE_TTL:-720h}
      - DENKIT_ARCHIVE_GC_INTERVAL=${DENKIT_ARCHIVE_GC_INTERVAL:-1h}
      - DENKIT_ARCHIVE_GC_BATCH=${DENKIT_ARCHIVE_GC_BATCH:-100}
      - DENKIT_ARCHIVE_REBUILD_TIMEOUT=${DENKIT_ARCHIVE_REBUILD_TIMEOUT:-20m}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - scratch_data:/scratch
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.services.denkit-stash.loadbalancer.server.port=${PORT}"
      - "traefik.http.routers.denkit-stash.rule=Host(`${DENKIT_SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.denkit-stash.entrypoints=websecure"
      - "traefik.http.routers.denkit-stash.tls=true"
      - "traefik.http.routers.denkit-stash.service=denkit-stash"

      - "traefik.http.routers.denkit-stash-api.rule=Host(`${DENKIT_API_SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.denkit-stash-api.entrypoints=websecure"
      - "traefik.http.routers.denkit-stash-api.tls=true"
      - "traefik.http.routers.denkit-stash-api.service=denkit-stash"

  db:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: denkit-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  rustfs:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    container_name: denkit-rustfs
    restart: unless-stopped
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_SERVER_DOMAINS=${DENKIT_STORAGE_SUBDOMAIN}.${DOMAIN}
    command: ["--address", ":9000", "--console-enable", "--server-domains", "${DENKIT_STORAGE_SUBDOMAIN}.${DOMAIN}", "/data"]
    volumes:
      - rustfs_data:/data
    networks:
      - default
      - traefik
    ports:
      - "127.0.0.1:9001:9001"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.services.rustfs-api.loadbalancer.server.port=9000"
      - "traefik.http.routers.rustfs-api.rule=Host(`${DENKIT_STORAGE_SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.rustfs-api.entrypoints=websecure"
      - "traefik.http.routers.rustfs-api.tls=true"
      - "traefik.http.routers.rustfs-api.service=rustfs-api"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    name: ${DB_VOLUME_NAME}
  rustfs_data:
    name: ${RUSTFS_VOLUME_NAME}
  scratch_data:
    name: ${SCRATCH_VOLUME_NAME:-denkit_scratch_data}

networks:
  traefik:
    name: ${TRAEFIK_NETWORK}
    external: true
  default:
    name: denkit-network
