services:
  denkit-stash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: denkit-stash
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_USE_SSL=${S3_USE_SSL}
      - PORT=${PORT}
      - GIN_MODE=${GIN_MODE}
      - LOG_LEVEL=${LOG_LEVEL}
      - ENABLE_DEV_ENDPOINTS=false
      - DENKIT_API_KEY_HASH_SECRET=${DENKIT_API_KEY_HASH_SECRET}
      - DENKIT_HTTP_READ_HEADER_TIMEOUT=${DENKIT_HTTP_READ_HEADER_TIMEOUT:-5s}
      - DENKIT_HTTP_READ_TIMEOUT=${DENKIT_HTTP_READ_TIMEOUT:-30m}
      - DENKIT_HTTP_WRITE_TIMEOUT=${DENKIT_HTTP_WRITE_TIMEOUT:-30m}
      - DENKIT_HTTP_IDLE_TIMEOUT=${DENKIT_HTTP_IDLE_TIMEOUT:-2m}
      - DENKIT_MAX_REQUEST_BODY_BYTES=${DENKIT_MAX_REQUEST_BODY_BYTES:-1048576}
      - DENKIT_MAX_UPLOAD_SESSION_BYTES=${DENKIT_MAX_UPLOAD_SESSION_BYTES:-53687091200}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.services.denkit-stash.loadbalancer.server.port=${PORT}"
      - "traefik.http.routers.denkit-stash.rule=Host(`${DENKIT_SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.denkit-stash.entrypoints=websecure"
      - "traefik.http.routers.denkit-stash.tls=true"
      - "traefik.http.routers.denkit-stash.service=denkit-stash"

      - "traefik.http.routers.denkit-stash-api.rule=Host(`${DENKIT_API_SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.denkit-stash-api.entrypoints=websecure"
      - "traefik.http.routers.denkit-stash-api.tls=true"
      - "traefik.http.routers.denkit-stash-api.service=denkit-stash"

  db:
    image: postgres:18.4-alpine3.23@sha256:38346350acb3e824c6948e6df7ff4759f48ba09d8ef4cb8d1b6e6db120f56872
    container_name: denkit-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  rustfs:
    image: rustfs/rustfs@sha256:fa19210ac4697c79d7ccca1ec9b0eb91aebacc6691991ffb14014bb3c67e6cc3
    container_name: denkit-rustfs
    restart: unless-stopped
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_SERVER_DOMAINS=${DENKIT_STORAGE_SUBDOMAIN}.${DOMAIN}
    command: ["--address", ":9000", "--console-enable", "--server-domains", "${DENKIT_STORAGE_SUBDOMAIN}.${DOMAIN}", "/data"]
    volumes:
      - rustfs_data:/data
    networks:
      - default
      - traefik
    ports:
      - "127.0.0.1:9001:9001"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.services.rustfs-api.loadbalancer.server.port=9000"
      - "traefik.http.routers.rustfs-api.rule=Host(`${DENKIT_STORAGE_SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.rustfs-api.entrypoints=websecure"
      - "traefik.http.routers.rustfs-api.tls=true"
      - "traefik.http.routers.rustfs-api.service=rustfs-api"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    name: ${DB_VOLUME_NAME}
  rustfs_data:
    name: ${RUSTFS_VOLUME_NAME}

networks:
  traefik:
    name: ${TRAEFIK_NETWORK}
    external: true
  default:
    name: denkit-network
