name: CI

on:
  push:
    branches:
      - development
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  GOFLAGS: -mod=readonly
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Verify GitHub Actions workflow
        run: make actionlint

      - name: Generate OpenAPI docs
        run: make openapi-generate

      - name: Verify generated OpenAPI docs are current
        run: git diff --exit-code -- docs

      - name: Validate OpenAPI docs
        run: make openapi-validate

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        env:
          DENKIT_TEST_POSTGRES_HOST: 127.0.0.1
          DENKIT_TEST_POSTGRES_PORT: 5432
          DENKIT_TEST_POSTGRES_USER: postgres
          DENKIT_TEST_POSTGRES_PASSWORD: postgres
          DENKIT_TEST_POSTGRES_DB: postgres
          DENKIT_TEST_POSTGRES_SSLMODE: disable
        run: go test ./...

      - name: Scan Go vulnerabilities
        run: make govulncheck

      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o denkit-stash .

  contract-test:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Run butler compatibility contract
        run: make contract-test

  docker-build:
    name: Docker ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs:
      - test
      - contract-test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Set image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
