name: CI

on:
  push:
    branches:
      - development
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  GOFLAGS: -mod=readonly
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.4-alpine3.23@sha256:38346350acb3e824c6948e6df7ff4759f48ba09d8ef4cb8d1b6e6db120f56872
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Verify GitHub Actions workflow
        run: make actionlint

      - name: Generate OpenAPI docs
        run: make openapi-generate

      - name: Verify generated OpenAPI docs are current
        run: git diff --exit-code -- docs

      - name: Validate OpenAPI docs
        run: make openapi-validate

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        env:
          DENKIT_TEST_POSTGRES_HOST: 127.0.0.1
          DENKIT_TEST_POSTGRES_PORT: 5432
          DENKIT_TEST_POSTGRES_USER: postgres
          DENKIT_TEST_POSTGRES_PASSWORD: postgres
          DENKIT_TEST_POSTGRES_DB: postgres
          DENKIT_TEST_POSTGRES_SSLMODE: disable
        run: go test ./...

      - name: Scan Go vulnerabilities
        run: make govulncheck

      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o denkit-stash .

  contract-test:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Run butler compatibility contract
        run: make contract-test

  docker-build:
    name: Docker ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs:
      - test
      - contract-test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Set image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
